<style>
.back-to-top {
  position: fixed;
  right: 1.5rem;
  bottom: 1.5rem;
  z-index: 500;
  width: 3rem;
  height: 3rem;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--frost-blue), var(--frost-lilac));
  color: #fff;
  font-size: 1.4rem;
  line-height: 1;
  box-shadow: 0 8px 20px rgba(10, 26, 51, .3);
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: opacity .2s ease-in-out, transform .2s ease-in-out, visibility .2s;
}
.back-to-top.is-visible {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}
.back-to-top:hover {
  filter: brightness(1.08);
}
@media (prefers-reduced-motion: reduce) {
  .back-to-top { transition: none; }
}
</style>

<script>
(function() {
  function init() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'js-back-to-top';
    btn.className = 'back-to-top';
    btn.setAttribute('aria-label', '맨 위로');
    btn.innerHTML = '<span aria-hidden="true">❄</span>';
    document.body.appendChild(btn);

    function toggleVisibility() {
      if (window.scrollY > 400) {
        btn.classList.add('is-visible');
      } else {
        btn.classList.remove('is-visible');
      }
    }

    btn.addEventListener('click', function() {
      var html = document.documentElement;
      var prevBehavior = html.style.scrollBehavior;
      html.style.scrollBehavior = 'auto';
      window.scrollTo(0, 0);
      html.style.scrollBehavior = prevBehavior;
    });

    window.addEventListener('scroll', toggleVisibility, { passive: true });
    toggleVisibility();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
